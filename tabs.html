<!-- Research / Teaching tabs under the profile.
     Adds two tabs below the CV/Email links and shows one section at a time.
     Sections are any block in index.qmd marked with class "tab-section". -->
<script>
document.addEventListener("DOMContentLoaded", function () {
  var sections = Array.from(document.querySelectorAll(".tab-section"));
  var profile = document.querySelector(".about-entity");
  if (!sections.length || !profile) return;

  var nav = document.createElement("nav");
  nav.className = "profile-tabs";
  nav.setAttribute("role", "tablist");
  nav.setAttribute("aria-label", "Sections");

  sections.forEach(function (sec) {
    var btn = document.createElement("button");
    btn.type = "button";
    btn.setAttribute("role", "tab");
    btn.id = "tab-" + sec.id;
    btn.setAttribute("aria-controls", sec.id);
    btn.textContent = sec.dataset.tab || sec.id;
    sec.setAttribute("role", "tabpanel");
    sec.setAttribute("aria-labelledby", btn.id);
    btn.addEventListener("click", function () {
      show(sec.id);
      history.replaceState(null, "", "#" + sec.id);
      // On phones the profile sits above the bio, so jump down to the section
      if (window.matchMedia("(max-width: 991px)").matches) {
        sec.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    });
    nav.appendChild(btn);
  });
  profile.appendChild(nav);

  function show(id) {
    sections.forEach(function (sec) {
      var on = sec.id === id;
      sec.hidden = !on;
      var btn = document.getElementById("tab-" + sec.id);
      btn.setAttribute("aria-selected", on ? "true" : "false");
      btn.tabIndex = on ? 0 : -1;
    });
  }

  // Arrow keys move between tabs
  nav.addEventListener("keydown", function (e) {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft" &&
        e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
    var tabs = Array.from(nav.querySelectorAll("button"));
    var i = tabs.indexOf(document.activeElement);
    var next = tabs[(i + (e.key === "ArrowRight" || e.key === "ArrowDown" ? 1 : tabs.length - 1)) % tabs.length];
    next.focus(); next.click(); e.preventDefault();
  });

  // Open the tab named in the address (e.g. yoursite/#teaching), otherwise the first
  var start = location.hash.slice(1);
  show(sections.some(function (s) { return s.id === start; }) ? start : sections[0].id);
});
</script>
